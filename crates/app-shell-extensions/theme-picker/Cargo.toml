[package]
name = "app-shell-theme-picker"
description = "The theme picker as a built-in extension (extension.toml): ⌘K's \"Choose a theme…\" and \"Light or dark\", ⌘O's theme: source; linked into an app, or run as its own process, through the host service either way."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/FastTrackStudios/app-shell"
publish = false

[lib]
doctest = false

[[bin]]
name = "app-shell-theme-picker"
path = "src/main.rs"

[dependencies]
# The trait (`linked-core`): linked into an app, a browser's too; off the
# browser also its process copy (`guest`, vox and tokio).
architect-extensions = { git = "https://github.com/FastTrackStudios/architect", branch = "strip/application-framework", features = ["linked-core"] }
serde_json = "1.0"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
architect-extensions = { git = "https://github.com/FastTrackStudios/architect", branch = "strip/application-framework", features = ["guest"] }
architect-extensions-dioxus = { git = "https://github.com/FastTrackStudios/architect", branch = "strip/application-framework", features = ["guest"] }

[dev-dependencies]
architect = { git = "https://github.com/FastTrackStudios/architect", branch = "strip/application-framework", features = ["action-list"] }
architect-extensions = { git = "https://github.com/FastTrackStudios/architect", branch = "strip/application-framework", features = ["host", "linked", "process"] }
architect-settings = { git = "https://github.com/FastTrackStudios/architect", branch = "strip/application-framework" }
architect-theme = { git = "https://github.com/FastTrackStudios/architect", branch = "strip/application-framework", features = ["actions"] }
facet = "=0.50.0-rc.7"
futures = "0.3"
tempfile = "3"
