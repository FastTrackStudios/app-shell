[package]
name = "app-shell-native"
description = "app-shell's native side: pop-out OS windows and window decorations on dioxus-native (Blitz)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# Menu bar / system tray apps (src/tray): a tray icon and its menu, running
# with no window, windows (app-shell or a web view) opened from the tray, a
# quick panel under the icon, start at login. A browser build never pulls it.
tray = ["dep:wry", "dep:ksni", "dep:gtk", "dep:tray-icon"]

[dependencies]
app-shell.workspace = true
# A window showing a URL in the platform's web view (WindowKind::Web).
wry = { version = "0.57", optional = true }
dioxus = { workspace = true, features = ["macro", "html", "signals", "hooks", "document"] }
# The renderer: Vello on wgpu, the system's fonts, SVG icons, Blitz's HTML
# parser for `dangerous_inner_html`.
dioxus-native = { workspace = true, features = ["vello", "system-fonts", "svg", "html", "clipboard"] }
# The pop-outs' views and their event loop proxy, as dioxus-native builds
# its own window: the same versions it pins.
blitz-shell = { version = "=0.3.0-beta.4", default-features = false }
blitz-html = "=0.3.0-beta.4"
tracing.workspace = true
futures-channel = "0.3"
# A document's loads (src/net.rs), as dioxus-native's own launch makes
# them: `asset!()` files from the app's bundle, the rest over the network.
blitz-traits = "=0.3.0-beta.4"
blitz-net = "=0.3.0-beta.4"
dioxus-asset-resolver = "=0.8.0-alpha.3"
tokio = { version = "1", features = ["rt-multi-thread"] }
# Shots (src/shot.rs): the window's document painted again on the CPU, as
# a PNG. The versions dioxus-native's blitz pins.
blitz-dom = "=0.3.0-beta.4"
blitz-paint = "=0.3.0-beta.4"
anyrender = "0.14"
anyrender_vello_cpu = "0.18"
peniko = "0.6"
png = "0.17"
futures-timer = "3"
futures-util = { version = "0.3", default-features = false }

# A Mac window's own traffic lights, placed in the top bar's row
# (src/mac.rs).
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSResponder", "NSView", "NSWindow", "NSButton", "NSControl", "NSApplication", "NSRunningApplication"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry", "NSThread"] }

# The tray on Linux: a StatusNotifierItem over D-Bus (KDE, GNOME with the
# AppIndicator extension, most panels), no GTK needed for the tray itself.
# GTK runs wry's web views there.
[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", default-features = false, features = ["async-io", "blocking"], optional = true }
gtk = { version = "0.18", optional = true }

# The tray on macOS (the menu bar) and Windows (the notification area).
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
tray-icon = { version = "0.26", optional = true }
