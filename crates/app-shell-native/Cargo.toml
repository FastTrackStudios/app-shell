[package]
name = "app-shell-native"
description = "app-shell's native side: pop-out OS windows and window decorations on dioxus-native (Blitz)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
app-shell.workspace = true
dioxus = { workspace = true, features = ["macro", "html", "signals", "hooks", "document"] }
# The renderer: Vello on wgpu, the system's fonts, SVG icons, Blitz's HTML
# parser for `dangerous_inner_html`.
dioxus-native = { workspace = true, features = ["vello", "system-fonts", "svg", "html", "clipboard"] }
# The pop-outs' views and their event loop proxy, as dioxus-native builds
# its own window: the same versions it pins.
blitz-shell = { version = "=0.3.0-beta.4", default-features = false }
blitz-html = "=0.3.0-beta.4"
tracing.workspace = true
futures-channel = "0.3"
futures-util = { version = "0.3", default-features = false }

# A Mac window's own traffic lights, placed in the top bar's row
# (src/mac.rs).
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSResponder", "NSView", "NSWindow", "NSButton", "NSControl"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry"] }
